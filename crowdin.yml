# Crowdin sync for the settings-window and overlay strings.
#
#   crowdin upload sources        - push newly added strings for translation
#   crowdin upload translations   - push translations made in the repository
#   crowdin download              - pull finished translations back
#   python scripts/compile_locales.py
#                                 - required afterwards: Crowdin round-trips
#                                   .po, the app reads .mo
#
# Needs CROWDIN_PROJECT_ID and CROWDIN_PERSONAL_TOKEN in the environment.

"project_id_env": "CROWDIN_PROJECT_ID"
"api_token_env": "CROWDIN_PERSONAL_TOKEN"

# The project keeps its files flat at the root, so the local path is mapped
# onto the existing /en_US.po through 'dest' rather than mirrored. Without that
# a second, parallel source file would appear and none of the existing
# translations would apply to it. 'dest' in turn requires preserve_hierarchy.
"preserve_hierarchy": true

files:
  - source: /TataruHelper/Locale/en-US/en-US.po
    dest: /en_US.po

    # Folder and file are both named after the locale, which is what Crowdin
    # substitutes on its side as well, so upload and download agree without
    # any languages_mapping. The server-side export pattern on this file must
    # be kept identical.
    translation: /TataruHelper/Locale/%locale%/%locale%.po
